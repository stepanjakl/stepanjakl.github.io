# This workflow is triggered by a push to the `release` branch
# It checks out, minimises the appropriate html/css/js in-place, and pushes the changes to the `gh-pages` branch
# Inspired by: https://stackoverflow.com/a/73882805/11035513

name: minify-assets
run-name: minify assets

# Run on pushes to `release` branch
on:
  push:
    branches:
      - release

jobs:
  checkout-minify-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install NodeJS and CLI tools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pinned to major version (semver minor/patch only); keep in sync with minify-test.sh
      - run: npm install -g terser@5
      - run: npm install -g csso-cli@4
      - run: npm install -g html-minifier@4
      - run: npm install -g svgo@4

      # Perform minification, overwriting original files (originals preserved on release branch)
      - run: |
          set -e
          # Minify JS files
          for js_file in scripts/*.js; do
            echo "Minifying $js_file"
            terser "$js_file" --compress --mangle --output "$js_file"
          done
          # Minify CSS files
          css_font_files=$(ls ./styles/*.css)
          echo "$css_font_files" | while IFS= read -r file; do
            echo "Minifying $file"
            csso "$file" --output "$file"
          done
          # Minify HTML
          html-minifier --case-sensitive --collapse-inline-tag-whitespace --collapse-whitespace --minify-css --minify-js --minify-urls --quote-character='"' --remove-comments index.html --output index.html
          # Optimise images (SVGs only)
          svgo -f ./images --exclude icons.svg --exclude logos.svg

      # (Force) push changes to `gh-pages` branch
      - run: |
          git config user.name stepanjakl
          git config user.email stepan.jakl@outlook.com
          git commit -am "Automated minify of ${{ github.sha }}"
          git push --force -u origin release:gh-pages
