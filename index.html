                                                <p class="text-p">
                                                    Between 2021 and 2024, I worked with CloudRaker to build and maintain a network of websites for The Fertility Partners (TFP) — one of North America’s largest fertility clinic groups. Over this period, I led the planning, development, and ongoing maintenance of seven full marketing sites and several existing ones, totalling around 4,000 hours of work.
                                                    <br>

                                                    I was the main technical lead and point of contact between CloudRaker, TFP, and my own team at Bohemica Studio. My role went far beyond coding: I translated business needs into technical plans, coordinated designers and developers, and ensured every launch met high standards for accessibility, SEO, and performance.

                                                    <br>

                                                    <br>
                                                    <br>
                                                    Post-launch, I maintained the full suite—handling updates, monitoring performance, and implementing improvements under a long-term support agreement. The result was a unified, scalable platform that empowered the client’s marketing teams to manage content independently.
