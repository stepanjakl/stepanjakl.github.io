                                                    </li>

                                            </nav>
                                            <p>Between 2021 and 2024, I collaborated with CloudRaker, a digital consulting agency, to design, build, and maintain a network of websites for The Fertility Partners (TFP) — one of North America&rsquo;s largest fertility clinic groups. Over this period, I led the planning, development, and long-term maintenance of seven full marketing sites and several existing ones, representing roughly 4,000 hours of work.</p>
                                            <p>I was the main technical lead and point of contact between CloudRaker, TFP, and my team at Bohemica Studio. My role went far beyond coding: I translated business goals into robust technical strategies, coordinated designers and developers, and ensured every launch met high standards of performance, accessibility, and SEO.</p>
                                            <p>All sites were built on ApostropheCMS (versions 2 and 3). I architected a system of reusable modules and custom widgets to make content editing intuitive for non-technical users. This included implementing multilingual content, continuous integration/deployment pipelines, analytics tracking, and error monitoring. Throughout the project, we continuously optimised load times, improved accessibility, and refined the CMS editor&rsquo;s user experience. Post-launch, I managed the full suite under a long-term support agreement: applying updates, monitoring performance, and rolling out iterative improvements. The result was a unified, scalable platform that empowered the client&rsquo;s marketing teams to manage content independently across the entire clinic network.</p>
                                            <p>The project&rsquo;s scale and impact were substantial. Each site comprised hundreds of pages of content in multiple languages, serving a combined audience of thousands of visitors per month. We created a centralised template system so that enhancements (new widgets, scripts, or layouts) could be shared across all sites. Performance and SEO were optimised to handle high traffic, and analytics dashboards were set up to measure user engagement and guide ongoing refinements. In sum, this effort not only modernised TFP&rsquo;s digital presence but also delivered a repeatable, efficient platform for future growth.</p>

                                                <span>ApostropheCMS Extensions</span>
                                            </h3>
                                            <p>Alongside the main TFP project, I developed several ApostropheCMS extensions to streamline development and add functionality. These tools supported TFP&rsquo;s ecosystem and became reusable assets for future Apostrophe projects.</p>

                                                           target="_blank">Template Demo Page Scrollthrough<span class="mid">(0:50)</span></a>
                                                    </li>
                                                </ul>
                                            </nav>
                                            <p>I created a shared template and module library, which I implemented as a Git submodule for all Apostrophe 3 sites. It included base code, Tailwind CSS styling, configuration, and reusable components. Each new project linked this template at the start, enabling rapid deployment of common features.</p>
                                            <p>As development continued, new modules and enhancements were merged back into the library so that every site benefitted from the latest improvements. The setup also supported advanced integrations such as form validation, scroll animations, and WebGL content, all configurable directly through the CMS. This approach made development faster, more consistent, and highly adaptable.</p>

                                                    <li>
                                                        <span>Repo:</span>

                                                    </li>
                                                </ul>
                                            </nav>
                                            <p>Together with the team at Bohemica Studio, we developed a terminal-based Node.js utility for synchronising MongoDB collections and uploaded assets across local, staging and production environments. The tool allowed developers to pull or push complete site data with a single command, replacing manual export and import processes. The extension improved reliability, saved time, and ensured consistent, up-to-date content across all environments, greatly simplifying both testing and deployment.</p>

                                            <p>A key part of my role was ensuring we stayed at the cutting edge of our industry. I encouraged the ongoing adoption of modern tools and best practices, keeping our technical stack current and our workflows efficient. This focus on thoughtful progress ensured that we consistently delivered solutions that were not only well-crafted but also technically sound and built to last.</p>

                                                           target="_blank">
                                                            <span>@stepanjakl/aeropot-arduino</span>
                                                        </a>
                                                    </li>
                                                </ul>
                                            </nav>
                                            <p>Aéropot was born from my Master&rsquo;s thesis in Sustainability, Entrepreneurship, and Design at Brunel University. The project was a deep dive into solving real-world challenges such as urbanisation and resource scarcity through technology. The goal was to create a smart indoor gardening system that not only made plant cultivation more accessible and efficient but also served as an educational tool. It was a multidisciplinary venture that blended environmental science with product design, software engineering, and hardware prototyping to create a fully functional proof of concept.</p>
                                            <p>The vision was to design a device that was both useful and aesthetically pleasing, fitting seamlessly into a modern home. I handled the end-to-end design process, from initial market research and competitor analysis to the final 3D CAD modelling and product rendering. The planter&rsquo;s form was carefully considered, using principles such as the golden ratio and continuous curvature to create an ergonomic and aesthetically pleasing chassis. This design-led approach ensured that every technical component was housed within a structure that prioritised user experience and a clean, unobtrusive look.</p>
                                            <p>The most demanding technical hurdle was engineering a custom ultrasonic atomiser circuit. After discovering off-the-shelf solutions were unreliable, I reverse-engineered a driver circuit from scratch. This involved a deep dive into high-frequency oscillators, where I learned that component tolerances were critical; identical transistors from different manufacturers yielded vastly different results. The solution required hand-winding copper inductor coils and using an oscilloscope to meticulously fine-tune the circuit until it produced a stable 1.7MHz mist. This process of trial and error, and persistence, was a powerful lesson in practical, hands-on engineering.</p>
                                            <p>The system&rsquo;s automation was handled by an Arduino microcontroller, which I programmed in C++ to execute a control loop that managed the plant&rsquo;s environment. The microcontroller continuously polled an array of sensors monitoring pH, nutrient concentration (TDS), temperature, and humidity. Based on this incoming data and predefined optimal ranges, it actuated the LED grow lights, ventilation fans, and nutrient atomisation cycles. For remote access, I integrated an ESP8266 WiFi module to establish a complete IoT communication pipeline. Sensor data was transmitted via the Blynk platform to a Google Firebase real-time database, which was then visualised on a custom smartphone application, giving the user a live data dashboard and the ability to manually override the automated routines.</p>
                                            <p>From a single concept on paper to a tangible, working prototype, Aéropot was a comprehensive exercise in turning an idea into reality. The project spanned the full product development lifecycle: business planning, user-centric design, hardware engineering, and full-stack software development. It was a rewarding challenge that pushed my skills in everything from circuit design and embedded programming to cloud-based data systems and user interface development, ultimately creating a product that is functional, sustainable, and engaging.</p>
